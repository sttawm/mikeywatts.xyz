<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi0.5 survey</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --accent: #2563eb; --border: #e5e7eb; --maxw: 40rem;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa3b2; --accent: #6ea8fe; --border: #232733; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: var(--maxw); margin: 0 auto; padding: 4rem 1.25rem; }
  a { color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p id="msg">Taking you to a set of clips&hellip;</p>
  <noscript><p>JavaScript is off, so this can't pick one for you — go straight to the <a href="index.html">link list</a> instead.</p></noscript>
</main>
<script>
  (function () {
    var CYCLE = ["robot-1", "robot-2", "kid-1", "kid-2", "adult-1", "adult-2"];
    var pick = CYCLE[Math.floor(Math.random() * CYCLE.length)];
    location.replace(pick + ".html");
  })();
</script>
</body>
</html>
