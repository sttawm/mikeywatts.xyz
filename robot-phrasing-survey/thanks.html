<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — pi0.5 survey</title>

<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --accent: #2563eb;
    --border: #e5e7eb; --card: #f8f9fb; --maxw: 40rem;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa3b2; --accent: #6ea8fe; --border: #232733; --card: #161922; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: var(--maxw); margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.85rem; line-height: 1.2; margin: 0 0 .6rem; }
  .lede { color: var(--muted); margin: 0 0 .5rem; }
  .continue-card {
    display: none; border: 1px solid var(--border); border-radius: 10px; background: var(--card);
    padding: 1.25rem 1.4rem 1.5rem; margin: 1.5rem 0;
  }
  .continue-card.show { display: block; }
  .continue-card p { color: var(--muted); margin: 0 0 1rem; }
  button, .btn {
    font: inherit; font-weight: 600; background: var(--accent); color: #fff;
    border: none; border-radius: 6px; padding: .75rem 1.6rem; cursor: pointer;
    display: inline-block; text-decoration: none;
  }
  button:hover, .btn:hover { opacity: .92; }
  .foot-link { margin-top: 3rem; font-size: .9rem; color: var(--muted); }
</style>

</head>
<body>
<main>
  <h1 id="heading">Thanks!</h1>
  <p class="lede" id="lede">Your answers help us see how robots respond to variations in phrasing.</p>

  <div class="continue-card" id="continue-card">
    <p>If you've got a bit more energy, there's another set of 14 clips waiting — a different audience or a different half of the clips. Totally optional, no pressure either way.</p>
    <a class="btn" id="continue-link" href="#">Do another set &rarr;</a>
  </div>

  <p class="foot-link"><a href="/">mikeywatts.xyz</a></p>
</main>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var next = params.get("next");
    var VALID = ["robot-1", "robot-2", "kid-1", "kid-2", "adult-1", "adult-2"];

    if (next && VALID.indexOf(next) !== -1) {
      document.getElementById("heading").textContent = "Thanks for that set!";
      document.getElementById("lede").textContent = "Your answers help us see how robots respond to variations in phrasing. Nothing else required here.";
      var card = document.getElementById("continue-card");
      card.classList.add("show");
      document.getElementById("continue-link").href = next + ".html?continued=1";
    } else {
      document.getElementById("heading").textContent = "That's it — thanks!";
      document.getElementById("lede").textContent = "Your answers help us see how robots respond to variations in phrasing. You've gone through everything there is — nothing else to do here.";
    }
  })();
</script>
</body>
</html>
